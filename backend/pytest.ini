[pytest]
# Run from /app/backend:
#   python -m pytest                                 → full suite (~140s serial, ~35s with -n auto)
#   python -m pytest -m smoke                        → launch-day smoke (~3s)
#   python -m pytest -m unit                         → only pure-helper unit tests
#   python -m pytest -m "not slow" -n auto           → fast tier (~20s parallel; iteration-friendly, safe subset)
#   ./ci.sh                                          → same as above, wrapped
#   python -m pytest --cov=services --cov=parents_import_utils
#
# The `slow` marker tags any test that takes >5 s wall-time (typically
# large restore/backup lifecycles). CI/deploy pipeline runs the FULL
# suite; iterative main-agent work uses `not slow` + xdist.
testpaths = tests
addopts = -ra --strict-markers
markers =
    unit: stateless unit tests (no DB / no HTTP); fast.
    smoke: launch-day green-light suite (~3s); hits every critical
        endpoint on the live preview backend. See test_smoke_launch.py.
    slow: individual tests that take more than ~5s; excluded from the
        `ci` iteration tier via -m "not slow". Deploy pipeline still
        runs them.
