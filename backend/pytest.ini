[pytest]
# Run from /app/backend:
#   python -m pytest                                 → smoke + service tests
#   python -m pytest -m unit                         → only the pure-helper unit tests
#   python -m pytest --cov=services --cov=parents_import_utils
testpaths = tests
addopts = -ra --strict-markers
markers =
    unit: stateless unit tests (no DB / no HTTP); fast.
    smoke: hits the live preview backend; needs valid admin credentials.
