<!doctype html>
<html><head><meta charset="utf-8"><title>Logo options</title>
<style>
  body{margin:0;background:#0f172a;font-family:system-ui,-apple-system,sans-serif;color:#fff;padding:24px}
  h2{text-align:center;margin:0 0 24px;letter-spacing:0.18em;font-weight:700;font-size:18px;color:#e2e8f0}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;max-width:1700px;margin:0 auto;align-items:start}
  .card{text-align:center}
  .label{font-size:12px;margin-bottom:10px;opacity:.85;letter-spacing:.06em}
  img{width:100%;background:#fff;border-radius:10px;display:block;box-shadow:0 8px 24px rgba(0,0,0,.4)}
</style></head><body>
<h2>FOUR TAGLINE OPTIONS · DIGNITY THROUGH SPORTS</h2>
<div class="grid">
  <div class="card"><div class="label">V1 · Navy uppercase, tracking</div><img src="/logo-options/v1_navy_uppercase.png"></div>
  <div class="card"><div class="label">V2 · Serif italic</div><img src="/logo-options/v2_serif_italic.png"></div>
  <div class="card"><div class="label">V3 · Teal flourish lines</div><img src="/logo-options/v3_with_flourish.png"></div>
  <div class="card"><div class="label">V4 · Gold underline</div><img src="/logo-options/v4_gold_underline.png"></div>
</div>
</body></html>
