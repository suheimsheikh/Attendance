crons:
  - name: daily-backup
    description: "Full database auto-backup to object storage every night at 2am IST; keeps the last 7 daily snapshots"
    cron: "0 2 * * *"
    timezone: "Asia/Kolkata"
    endpoint: "{{BASE_URL}}/api/cron/daily-backup"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: close-stale-sessions
    description: "Auto-closes attendance sessions left open from a previous day at ~00:45 IST so forgotten check-outs don't balloon into 16h+ records"
    cron: "45 0 * * *"
    timezone: "Asia/Kolkata"
    endpoint: "{{BASE_URL}}/api/cron/close-stale-sessions"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
