name: Lint

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Backend (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.6.9
      - name: Run ruff
        # Only fail the build on real errors — the existing codebase has
        # ~24 pre-existing style nits in server.py. Once those are cleaned
        # up, drop --select to enforce ruff's full ruleset.
        run: |
          ruff check backend/ --select=E9,F63,F7,F82 --output-format=github

  frontend:
    name: Frontend (eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Run eslint
        # Excludes shadcn/ui vendor files (we don't author them).
        run: |
          yarn eslint 'src/**/*.{js,jsx}' \
            --ignore-pattern 'src/components/ui/**' \
            --max-warnings 0
